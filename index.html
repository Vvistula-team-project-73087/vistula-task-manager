<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .task-item { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
    .completed { text-decoration: line-through; opacity: 0.7; }
    #status-message { color: red; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  <h2 id="student-id">73087</h2>

  <div id="status-message"></div>

  <form id="task-form">
    <input type="text" id="task-title" placeholder="Task Title (Required)" required>
    <textarea id="task-description" placeholder="Task Description"></textarea>
    <button type="submit" id="task-submit">Save Task</button>
  </form>

  <div id="task-list"></div>

  <hr>
  <p><a id="contribution-link" href="contribution.html">Team Contribution Page</a></p>

  <script src="app.js"></script>
</body>
</html>
